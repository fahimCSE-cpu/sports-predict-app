spring.application.name=Sports Predictive Selection System
server.port=${PORT:8080}

# Database (file-based H2, created in ./data on first run)
spring.datasource.url=jdbc:h2:file:./data/sportsdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Admin login (change before deploying!)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Prediction model: likelihood = p^winExponent * (1-p)^lossExponent
# Defaults (4 and 3) reproduce the worked Australia vs India example in the project brief.
app.prediction.win-exponent=4
app.prediction.loss-exponent=3

# Optional simple mail. Set enabled=true and fill spring.mail.* to really send.
# When disabled, mails are only written to the log.
app.mail.enabled=false
app.mail.from=noreply@sports-predict.local
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=you@gmail.com
#spring.mail.password=app-password
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# Seed sample matches / tips / demo analytics when the DB is empty
app.seed.enabled=true
