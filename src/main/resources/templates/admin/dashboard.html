<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Admin')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div th:replace="~{admin/_nav :: tabs('dashboard')}"></div>
<div th:replace="~{fragments :: flash}"></div>
<main class="wrap">
    <h1>Admin dashboard</h1>
    <div class="stats">
        <div class="stat"><b th:text="${publishedCount} + ' / ' + ${matchCount}">0</b><span>Published matches</span></div>
        <div class="stat"><b th:text="${views}">0</b><span>Page views</span></div>
        <div class="stat"><b th:text="${checks}">0</b><span>Prediction checks</span></div>
        <div class="stat"><b th:text="${votes}">0</b><span>Support votes</span></div>
        <div class="stat"><b th:text="${subscriberCount}">0</b><span>Subscribers</span></div>
        <div class="stat"><b th:text="${openInquiries}">0</b><span>Open inquiries</span></div>
    </div>

    <section class="panel">
        <h2>Page views - last 7 days</h2>
        <div th:replace="~{admin/_nav :: daychart(${perDay})}"></div>
        <a th:href="@{/admin/analytics}">Full analytics &rarr;</a>
    </section>

    <section class="panel">
        <h2>Latest unanswered questions</h2>
        <p th:if="${#lists.isEmpty(recent)}" class="empty">Nothing waiting. 🎉</p>
        <ul class="plain">
            <li th:each="q : ${recent}"><b th:text="${q.name}">Name</b> on <i th:text="${q.matchTitle}">match</i>: <span th:text="${q.message}">msg</span></li>
        </ul>
        <a th:href="@{/admin/inquiries}">Open inquiries &rarr;</a>
    </section>

    <p><a class="btn primary" th:href="@{/admin/matches/new}">+ Publish a new match</a></p>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
