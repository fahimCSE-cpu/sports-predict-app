<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Login')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="wrap narrow">
    <h1>Admin login</h1>
    <form th:action="@{/login}" method="post" class="form">
        <div class="errors" th:if="${param.error}"><p>Wrong username or password.</p></div>
        <div class="flash" th:if="${param.logout}">You have been logged out.</div>
        <label>Username <input type="text" name="username" autofocus required></label>
        <label>Password <input type="password" name="password" required></label>
        <button class="btn primary" type="submit">Log in</button>
    </form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
